<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpatCalc — Expat Salary Calculators 2026</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Design system & styles -->
  <link rel="stylesheet" href="styles/design-system.css">
  <link rel="stylesheet" href="styles/dashboard.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/countries.css">

  <!-- Import map: all external deps resolved via esm.sh -->
  <script type="importmap">
  {
    "imports": {
      "react":            "https://esm.sh/react@18.3.1",
      "react/":           "https://esm.sh/react@18.3.1/",
      "react-dom":        "https://esm.sh/react-dom@18.3.1?external=react",
      "react-dom/":       "https://esm.sh/react-dom@18.3.1&external=react/",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
      "react-router-dom": "https://esm.sh/react-router-dom@6.30.3?external=react,react-dom",
      "htm":              "https://esm.sh/htm@3.1.1"
    }
  }
  </script>

  <!-- Error handler: surface module loading failures -->
  <script>
    window.addEventListener('error', function(e) {
      var loader = document.getElementById('app-loader');
      if (loader) loader.innerHTML = '<div style="text-align:center;max-width:600px;padding:2rem"><div style="font-size:1.5rem;margin-bottom:0.5rem">⚠️ Failed to load</div><pre style="text-align:left;background:#fee;padding:1rem;border-radius:8px;overflow-x:auto;font-size:0.8rem">' + (e.message || e) + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '</pre></div>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      var loader = document.getElementById('app-loader');
      if (loader) loader.innerHTML = '<div style="text-align:center;max-width:600px;padding:2rem"><div style="font-size:1.5rem;margin-bottom:0.5rem">⚠️ Module error</div><pre style="text-align:left;background:#fee;padding:1rem;border-radius:8px;overflow-x:auto;font-size:0.8rem">' + (e.reason && e.reason.message || e.reason || 'Unknown error') + '</pre></div>';
    });
  </script>

  <!-- App entry -->
  <script type="module" src="app/main.js"></script>

  <style>
    /* Loading state — shown before React mounts */
    #app-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      background: #f9fafb;
      color: #6b7280;
      font-size: 0.95rem;
      gap: 12px;
    }
    #app-loader .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Hide loader once app is mounted */
    #app:not(:empty) + #app-loader { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="app-loader">
    <div class="spinner"></div>
    <span>Loading ExpatCalc…</span>
  </div>
</body>
</html>
